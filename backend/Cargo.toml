[package]
name = "fn-kzwr-backup"
version = "0.5.2"
edition = "2021"
description = "飞牛 NAS 增量加密备份系统（备份至酷族网软）"
license = "MIT"

[lib]
name = "fnos_backup"
path = "src/lib.rs"

[[bin]]
name = "fn-kzwr-backup"
path = "src/main.rs"

[dependencies]
# 直接依赖：Landlock 沙箱需要裸 syscall（libc 有 syscall 号，结构体本地声明）
libc = "0.2"
libloading = "0.8"
# HTTP 后端
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
# 统一网关：axum 0.7 的 serve 不支持 Unix Socket，直接用 hyper 服务网关连接
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "http1"] }
# 网关侧前缀剥离（map_request）
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（WebDAV 目标适配器，ADR-009）
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# 自定义请求体（带精确 size_hint 的流式上传，保留 Content-Length 同时上报进度）
http-body = "1"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 加密（age 公私钥；私钥/配置口令加密用 age 内置 scrypt，不引入额外 KDF 依赖）
age = "0.10"
zeroize = { version = "1", features = ["derive"] }

# 哈希（增量检测）
blake3 = "1"

# base64（配置敏感字段编码）
base64 = "0.22"

# 签名校验（外置插件 `.so` 的 Ed25519 签名验证，ADR-013）
# 用 ring 而非 ed25519-dalek：ring 已在依赖图中（间接），NAS 离线缓存齐全
ring = "0.17"

# 配置与日志
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 文件系统流式处理
futures = "0.3"
bytes = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

# 错误处理
thiserror = "1"
anyhow = "1"

# 临时文件（WebDAV 上传前暂存密文）
tempfile = "3"

# 定时备份调度（cron 解析 + 时间计算）
croner = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
# ⚠️ **刻意不设 `panic = "abort"`**（2026-09-29，曾设过，已按评审去掉）
#
# 设成 abort 会让**宿主全部 15 处 `catch_unwind` 在 release 下失效**
# （实测：panic 直接终止进程，连返回值都打印不出来）。插件是第三方代码，
# 一次 panic 就会把宿主连同所有备份任务一起干掉 —— 这在插件生态下不可接受。
#
# 代价：二进制更大（实测 8,967,728 → 10,059,600 字节，**+12.2%**），
# 且 panic 走 unwind 而非立即终止。换回的是「插件 panic 不再等于宿主崩溃」。
#
# ⚠️ 实测补充：仅去掉 abort **救不了** panic 写在 `extern "C" fn` 函数体内的情形 —
# 即便宿主是 unwind，运行时仍报 `thread caused non-unwinding panic. aborting.`
# （`extern "C"` 的 `nounwind` 属性所致）。那条必须由插件侧用
# `sdk::guard_str` 的**闭包形态**来防，详见 `plugins/sdk` 与 §7.8。
