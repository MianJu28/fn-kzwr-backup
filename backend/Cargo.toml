[package]
name = "fn-kzwr-backup"
version = "0.3.4"
edition = "2021"
description = "飞牛 NAS 增量加密备份系统（备份至酷族网软）"
license = "MIT"

[lib]
name = "fnos_backup"
path = "src/lib.rs"

[[bin]]
name = "fn-kzwr-backup"
path = "src/main.rs"

[dependencies]
# HTTP 后端
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
# 统一网关：axum 0.7 的 serve 不支持 Unix Socket，直接用 hyper 服务网关连接
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "http1"] }
# 网关侧前缀剥离（map_request）
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（WebDAV 目标适配器，ADR-009）
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# 自定义请求体（带精确 size_hint 的流式上传，保留 Content-Length 同时上报进度）
http-body = "1"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 加密（age 公私钥；私钥/配置口令加密用 age 内置 scrypt，不引入额外 KDF 依赖）
age = "0.10"
zeroize = { version = "1", features = ["derive"] }

# 哈希（增量检测）
blake3 = "1"

# base64（配置敏感字段编码）
base64 = "0.22"

# 配置与日志
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 文件系统流式处理
futures = "0.3"
bytes = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

# 错误处理
thiserror = "1"
anyhow = "1"

# 临时文件（WebDAV 上传前暂存密文）
tempfile = "3"

# 定时备份调度（cron 解析 + 时间计算）
croner = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
