[package]
name = "fn-kzwr-plugin-rdirect"
version = "1.0.0"
edition = "2021"
publish = false
description = "酷族备份 · 外置插件示例（Rust 直连：能力最全，但需与宿主同版本编译）"

[lib]
name = "fn_kzwr_plugin_rdirect"
crate-type = ["cdylib"]

[dependencies]
# ⚠️ Rust 直连插件必须依赖宿主 crate（传 Rust trait 对象）；Rust ABI 不稳定，
#    因此宿主会校验「编译期宿主版本 == 运行版本」——**升级主程序后必须重新编译本插件**。
#    若希望升级后免重编，请改用 plugins/example-hello（稳定 C ABI）。
fn-kzwr-backup = { path = "../../backend" }
async-trait = "0.1"
axum = "0.7"
serde_json = "1"
