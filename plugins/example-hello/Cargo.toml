[package]
name = "fn-kzwr-plugin-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "酷族备份 · 外置插件示例（动态库 / ADR-013 方案 B）"

[lib]
name = "fn_kzwr_plugin_example"
# 外置插件必须编译为动态库（宿主用 libloading 加载 *.so）
crate-type = ["cdylib"]

[dependencies]
# 与宿主同版本（路径依赖）：ABI 依赖宿主 crate 的 trait 定义，
# 因此插件必须随宿主源码一起编译，升级宿主后需重新编译插件
fn-kzwr-backup = { path = "../../backend" }
async-trait = "0.1"
axum = "0.7"
serde_json = "1"
